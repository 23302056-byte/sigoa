<div class="login-container">

  <div class="login-card">

    <div class="logo">
      SIGOA
    </div>

    <h1>Iniciar sesión</h1>

    <p class="descripcion">
      Sistema Integral de Gestión de Obras y Arquitectura
    </p>

    <form (ngSubmit)="iniciarSesion()">

      <div class="campo">

        <label for="correo">
          Correo
        </label>

        <input
          type="email"
          id="correo"
          name="correo"
          [(ngModel)]="correo"
          placeholder="Ingresa tu correo"
          autocomplete="email"
        >

      </div>

      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
        >

      </div>

      @if (mensaje) {
        <div class="mensaje">
          {{ mensaje }}
        </div>
      }

      <button
        type="submit"
        [disabled]="cargando"
      >
        @if (cargando) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
      </button>

    </form>

  </div>

</div>
