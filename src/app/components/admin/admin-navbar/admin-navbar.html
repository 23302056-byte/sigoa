<nav class="navbar">

  <div class="logo">
    <strong>SIGOA</strong>
    <span>Administración</span>
  </div>

  <div class="menu">

    <a
      routerLink="/admin"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>

    <a
      routerLink="/admin/proyectos"
      routerLinkActive="activo">
      Proyectos
    </a>

    <a
      routerLink="/admin/obras"
      routerLinkActive="activo">
      Obras
    </a>

    <a
      routerLink="/admin/cotizaciones"
      routerLinkActive="activo">
      Cotizaciones
    </a>

    <a
      routerLink="/admin/contratos"
      routerLinkActive="activo">
      Contratos
    </a>

    <a
      routerLink="/admin/pagos"
      routerLinkActive="activo">
      Pagos
    </a>

    <a
      routerLink="/admin/usuarios"
      routerLinkActive="activo">
      Usuarios
    </a>

  </div>

  <div class="acciones">

    <div class="usuario">

      <div class="avatar">
        {{ usuario?.nombre?.charAt(0) }}
      </div>

      <div class="datos">

        <strong>
          {{ usuario?.nombre }} {{ usuario?.apellidos }}
        </strong>

        <span>
          {{ usuario?.correo }}
        </span>

      </div>

    </div>

    <button
      class="cerrar"
      (click)="cerrarSesion()">
      Cerrar sesión
    </button>

  </div>

</nav>
