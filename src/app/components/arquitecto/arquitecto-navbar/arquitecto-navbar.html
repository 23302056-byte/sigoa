<nav class="navbar">
  <div class="logo">
    <strong>SIGOA</strong>
    <span>Arquitectura</span>
  </div>

  <div class="menu">
    <a routerLink="/arquitecto" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/arquitecto/proyectos" routerLinkActive="activo">Proyectos</a>
    <a routerLink="/arquitecto/obras" routerLinkActive="activo">Obras</a>
  </div>

  <div class="acciones">
    <div class="usuario">
      <div class="avatar">{{ usuario?.nombre?.charAt(0) || 'A' }}</div>
      <div class="datos">
        <strong>{{ usuario?.nombre }} {{ usuario?.apellidos }}</strong>
        <span>{{ usuario?.correo }}</span>
      </div>
    </div>
    <button class="cerrar" type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>
